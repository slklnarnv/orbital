# Twice-weekly refresh of the packaged fallback TLE (src/data/fallback-tle.json).
# Opens a PR when the data changed; merging it is a human decision.
#
# Repo setting required: Settings -> Actions -> General -> Workflow permissions
# -> "Allow GitHub Actions to create and approve pull requests". Without it,
# `gh pr create` fails (the branch is still pushed; open the PR by hand).
name: refresh-tle
on:
  schedule:
    - cron: '17 6 * * 1,4' # Mon + Thu 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # persist-credentials MUST stay true here: the push below uses the
      # checkout's credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run refresh:tle
      - name: Open a PR if the fallback TLE changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/fallback-tle.json; then
            echo "Fallback TLE unchanged"; exit 0
          fi
          npm run verify
          epoch=$(node -p "require('./src/data/fallback-tle.json').epoch.slice(0,10)")
          branch="chore/refresh-fallback-tle-$epoch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/fallback-tle.json
          git commit -m "Refresh packaged fallback TLE (epoch $epoch)"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh packaged fallback TLE (epoch $epoch)" \
            --body "Automated twice-weekly refresh via npm run refresh:tle; npm run verify passed." \
            || echo "PR already exists or PR creation is disabled for Actions"
