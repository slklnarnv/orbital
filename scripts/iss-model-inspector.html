<!doctype html>
<!-- Forensic inspection harness for public/models/iss_igoal.glb (audit session only). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IGOAL audit inspector</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
      #bar { position: fixed; top: 8px; left: 8px; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; max-width: 90vw; }
      #bar button { font: 12px system-ui; padding: 6px 10px; background: #1d2330; color: #cfe3ff; border: 1px solid #33405a; border-radius: 6px; cursor: pointer; }
      #bar button.active { background: #2b4a7a; }
      #log { position: fixed; bottom: 8px; left: 8px; z-index: 10; font: 11px/1.5 monospace; color: #9fd0a0; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="bar"></div>
    <div id="log"></div>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js'
      import { DRACOLoader } from '/node_modules/three/examples/jsm/loaders/DRACOLoader.js'
      import { OrbitControls } from '/node_modules/three/examples/jsm/controls/OrbitControls.js'

      const logEl = document.getElementById('log')
      const log = (msg) => { logEl.textContent += msg + '\n'; console.log(msg) }

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(innerWidth, innerHeight)
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      document.body.appendChild(renderer.domElement)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x101014)
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000)
      const controls = new OrbitControls(camera, renderer.domElement)

      scene.add(new THREE.HemisphereLight(0xffffff, 0x606068, 1.1))
      const key = new THREE.DirectionalLight(0xffffff, 2.2)
      key.position.set(60, 120, 40)
      scene.add(key)
      const fill = new THREE.DirectionalLight(0xdde6ff, 0.8)
      fill.position.set(-80, -40, -60)
      scene.add(fill)

      const draco = new DRACOLoader().setDecoderPath('/draco/')
      const loader = new GLTFLoader().setDRACOLoader(draco)

      loader.load(
        '/models/iss_igoal.glb',
        (gltf) => {
          const model = gltf.scene
          scene.add(model)
          currentModel = model
          log('[AUDIT] loaded /models/iss_igoal.glb')
          // Browser-side corroboration of the Node-side measurements.
          for (const name of [
            'P4_Array_2A', 'P6_2B_Array', 'S6_3B_Array',
            'IROSA_Deployed_P62B', 'P1_Radiator', 'S1_Radiator',
            'PORT_ALPHA_ROT', 'STBD_ALPHA_ROT', 'PORT_TRRJ_GAMMA_ROT',
            'STBD_TRRJ_GAMMA_ROT', 'MLM', 'MLM_Details_Misc', 'Zvezda_SM',
          ]) {
            const node = model.getObjectByName(name)
            if (!node) { log(`[AUDIT] ${name}: NOT FOUND`); continue }
            const box = new THREE.Box3().setFromObject(node)
            const size = box.getSize(new THREE.Vector3())
            const center = box.getCenter(new THREE.Vector3())
            log(
              `[AUDIT] ${name}: size ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}` +
              ` center (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`,
            )
          }
          for (const joint of ['PORT_ALPHA_ROT', 'STBD_ALPHA_ROT', 'PORT_TRRJ_GAMMA_ROT', 'STBD_TRRJ_GAMMA_ROT']) {
            const node = model.getObjectByName(joint)
            if (node) log(`[AUDIT] ${joint} world pos (${node.getWorldPosition(new THREE.Vector3()).toArray().map((v) => v.toFixed(2)).join(', ')})`)
          }
          requestAnimationFrame(() => setView(new URLSearchParams(location.hash.slice(1)).get('view') ?? 'overview'))
        },
        undefined,
        (error) => log('[AUDIT] LOAD FAILED: ' + String(error)),
      )

      const VIEWS = {
        overview: { pos: [80, 60, 170], target: [0, -6.8, 0] },
        radiatorsP1: { pos: [8, 22, -42], target: [-11.7, -0.1, -14.7] },
        radiatorsS1: { pos: [8, 22, 42], target: [-11.7, 0, 14.7] },
        radiatorsBoth: { pos: [60, 30, 0], target: [-12, -1, 0] },
        mlm: { pos: [-6, -4, 26], target: [-21.2, -11.9, 0] },
        mlmTop: { pos: [-10, -30, 20], target: [-21.2, -11.9, 0] },
        arrayP4: { pos: [18, 30, -18], target: [18, 1.3, -33.4] },
        arrayP6: { pos: [18, 30, -34], target: [18, 1.3, -48.4] },
        arrayS6: { pos: [-18, 26, 36], target: [-18, 1.2, 48.4] },
        sarjPort: { node: 'PORT_ALPHA_ROT', off: [26, 18, 14] },
        sarjStbd: { node: 'STBD_ALPHA_ROT', off: [26, 18, -14] },
        zvezda: { pos: [-6, 8, 42], target: [-29.4, -4.3, 0] },
      }
      const setView = (name) => {
        const v = VIEWS[name]
        if (!v) return
        const finish = (pos, target) => {
          camera.position.set(...pos)
          controls.target.set(...target)
          controls.update()
          document.querySelectorAll('#bar button').forEach((b) => b.classList.toggle('active', b.dataset.view === name))
        }
        if (v.node) {
          const node = scene.getObjectByName(v.node)
          if (!node) { log(`view ${name}: node not found`); return }
          const c = node.getWorldPosition(new THREE.Vector3())
          finish([c.x + v.off[0], c.y + v.off[1], c.z + v.off[2]], c.toArray())
        } else {
          finish(v.pos, v.target)
        }
      }

      const bar = document.getElementById('bar')
      for (const name of Object.keys(VIEWS)) {
        const b = document.createElement('button')
        b.textContent = name
        b.dataset.view = name
        b.onclick = () => { history.replaceState(null, '', '#' + name); setView(name) }
        bar.appendChild(b)
      }
      // Audit hooks: window.__setView('name') or window.__cam([x,y,z],[tx,ty,tz])
      window.__scene = scene
      window.__camera = camera
      window.__renderer = renderer
      window.__setView = (name) => setView(name)
      window.__cam = (pos, target) => {
        camera.position.set(...pos)
        controls.target.set(...target)
        controls.update()
      }
      // window.__isolate('P1_Radiator') — hide all OTHER meshes, frame the node.
      let currentModel = null
      window.__isolate = (name) => {
        if (!currentModel) return false
        const target = currentModel.getObjectByName(name)
        if (!target) return false
        const isAncestorOf = (node, maybeAncestor) => {
          let p = node.parent
          while (p) {
            if (p === maybeAncestor) return true
            p = p.parent
          }
          return false
        }
        currentModel.traverse((node) => {
          if (!(node instanceof THREE.Mesh)) return
          node.visible = node === target || isAncestorOf(node, target)
        })
        const box = new THREE.Box3().setFromObject(target)
        const center = box.getCenter(new THREE.Vector3())
        const size = box.getSize(new THREE.Vector3())
        const radius = Math.max(size.x, size.y, size.z) * 0.9
        const dir = new THREE.Vector3(0.45, 0.85, 0.35).normalize()
        camera.position.copy(center).addScaledVector(dir, radius)
        controls.target.copy(center)
        controls.update()
        return true
      }
      window.__restore = () => {
        if (!currentModel) return
        currentModel.traverse((node) => {
          if (node instanceof THREE.Mesh) node.visible = true
        })
      }

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })
      renderer.setAnimationLoop(() => renderer.render(scene, camera))
    </script>
  </body>
</html>
